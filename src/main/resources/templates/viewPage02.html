<html>
<head>
<title>Chap14</title>
</head>
<script>
	function deleteMember(id){
		if(confirm("정말로 삭제하시겠습니까?")){
			location.href = "/exam14_01/delete/"+id;
		}
	}
</script>
<body>
	<div align="center">
		<h3>JPA 데이터베이스</h3>
		<a th:href="@{/exam14_01/new}">Member 데이터 삽입</a> <br>
		<br>
		<table border="1" cellpadding="10">
			<tr>
				<th>아이디</th>
				<th>이름</th>
				<th>나이</th>
				<th>이메일</th>
				<th>비고</th>
			</tr>
			<tr th:each="member : ${memberList}">
				<td th:text="${member.id}"></td>
				<td th:text="${member.name}"></td>
				<td th:text="${member.age}"></td>
				<td th:text="${member.email}"></td>
				<td><a th:href="@{'/exam14_01/edit/' + ${member.id}}">Edit</a>&nbsp;&nbsp;&nbsp;&nbsp;
					<a th:onclick="deleteMember([[${member.id}]]); return false;" href ="#" >Delete</a>
					<a th:href="@{'/exam14_01/delete/' + ${member.id}}">Delete</a></td>
			</tr>
		</table>
	</div>
</body>
</html>
